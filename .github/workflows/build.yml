name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# 建 Release／掛檔案需要寫入權限（GITHUB_TOKEN 預設唯讀）
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Upload installer + update metadata (every build)
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
      - name: Attach to the GitHub Release (tags only) — latest.yml is what auto-update reads
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
